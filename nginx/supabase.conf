# ============================================================
# Nginx config for self-hosted Supabase — aaryavtech.online
#
# Install:
#   sudo cp nginx/supabase.conf /etc/nginx/sites-available/supabase
#   sudo ln -s /etc/nginx/sites-available/supabase /etc/nginx/sites-enabled/supabase
#   sudo nginx -t && sudo nginx -s reload
#
# Then get SSL:
#   sudo certbot --nginx -d supabase.aaryavtech.online -d api.aaryavtech.online
# ============================================================

# ── supabase.aaryavtech.online — Studio ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name supabase.aaryavtech.online;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supabase.aaryavtech.online;

    # SSL — certbot will fill these in automatically
    # ssl_certificate     /etc/letsencrypt/live/supabase.aaryavtech.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/supabase.aaryavtech.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Proxy to Envoy gateway (Supabase Studio served via port 8000)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # WebSocket support (required for Studio hot-reload)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Access logs
    access_log /var/log/nginx/supabase-studio-access.log;
    error_log  /var/log/nginx/supabase-studio-error.log;
}


# ── api.aaryavtech.online — Supabase API Gateway ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.aaryavtech.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aaryavtech.online;

    # ssl_certificate     /etc/letsencrypt/live/supabase.aaryavtech.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/supabase.aaryavtech.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # CORS for API access from browsers/apps
    set $cors_origin "*";
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info" always;
    add_header Access-Control-Max-Age       "86400" always;

    # Handle OPTIONS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── REST API ────────────────────────────────────────────
    location /rest/v1/ {
        proxy_pass         http://127.0.0.1:8000/rest/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Auth ────────────────────────────────────────────────
    location /auth/v1/ {
        proxy_pass         http://127.0.0.1:8000/auth/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Realtime WebSocket ──────────────────────────────────
    location /realtime/v1/ {
        proxy_pass         http://127.0.0.1:8000/realtime/v1/;
        proxy_http_version 1.1;

        # WebSocket upgrade — CRITICAL for Realtime
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # No timeout for persistent WebSocket connections
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 75s;
    }

    # ── Storage (large file uploads) ────────────────────────
    location /storage/v1/ {
        proxy_pass         http://127.0.0.1:8000/storage/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads (50MB default, adjust as needed)
        client_max_body_size 50M;
        proxy_read_timeout   300s;

        # Disable buffering for streaming uploads
        proxy_request_buffering off;
    }

    # ── Edge Functions ──────────────────────────────────────
    location /functions/v1/ {
        proxy_pass         http://127.0.0.1:8000/functions/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Catch-all (health, etc.) ────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/supabase-api-access.log;
    error_log  /var/log/nginx/supabase-api-error.log;
}
