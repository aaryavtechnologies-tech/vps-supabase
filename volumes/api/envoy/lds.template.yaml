resources:
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    name: supabase
    per_connection_buffer_limit_bytes: 32768  # 32 KiB

    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000

    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': >-
                type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              normalize_path: true
              merge_slashes: true
              path_with_escaped_slashes_action: REJECT_REQUEST
              use_remote_address: true
              common_http_protocol_options:
                headers_with_underscores_action: REJECT_REQUEST
              upgrade_configs:
                - upgrade_type: websocket
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %BYTES_SENT% \"%REQ(REFERER)%\" \"%REQ(USER-AGENT)%\"\n"

              http_filters:
                # ── Basic Auth for Studio dashboard ─────────────────────
                - name: envoy.filters.http.basic_auth
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
                    users:
                      inline_string: "${DASHBOARD_BASIC_AUTH}"

                # ── RBAC — restrict dashboard paths ─────────────────────
                - name: envoy.filters.http.rbac
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                    rules:
                      action: DENY
                      policies:
                        deny_anon_to_studio:
                          permissions:
                            - or_rules:
                                rules:
                                  - url_path:
                                      path:
                                        prefix: /studio
                                  - url_path:
                                      path:
                                        prefix: /api/platform
                                  - url_path:
                                      path:
                                        prefix: /pg
                          principals:
                            - not_id:
                                authenticated:
                                  principal_name:
                                    exact: supabase

                # ── JWT verification for API routes ──────────────────────
                - name: envoy.filters.http.jwt_authn
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                    providers:
                      supabase_jwt:
                        local_jwks:
                          inline_string: >-
                            {"keys":[{"kty":"oct","k":"${JWT_BASE64_SECRET}","alg":"HS256","use":"sig"}]}
                        from_headers:
                          - name: Authorization
                            value_prefix: "Bearer "
                          - name: apikey
                        forward: true
                    rules:
                      - match:
                          prefix: /auth/v1/verify
                        requires:
                          allow_missing: {}
                      - match:
                          prefix: /auth/v1/callback
                        requires:
                          allow_missing: {}
                      - match:
                          prefix: /auth/v1/
                        requires:
                          allow_missing: {}
                      - match:
                          prefix: /rest/v1/
                        requires:
                          allow_missing_or_failed: {}
                      - match:
                          prefix: /storage/v1/
                        requires:
                          allow_missing_or_failed: {}
                      - match:
                          prefix: /realtime/v1/
                        requires:
                          allow_missing: {}
                      - match:
                          prefix: /functions/v1/
                        requires:
                          allow_missing: {}

                - name: envoy.filters.http.router
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

              route_config:
                name: supabase_route
                virtual_hosts:
                  - name: supabase_host
                    domains:
                      - '*'
                    cors:
                      allow_origin_string_match:
                        - safe_regex:
                            regex: ".*"
                      allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD,CONNECT,TRACE"
                      allow_headers: "*"
                      expose_headers: "*"
                      max_age: "3600"
                    request_headers_to_add:
                      - header:
                          key: X-Forwarded-Host
                          value: "%REQ(:AUTHORITY)%"
                        append_action: ADD_IF_ABSENT
                    routes:
                      # ── Auth routes ──────────────────────────────────
                      - match:
                          prefix: /auth/v1/
                        route:
                          cluster: auth
                          prefix_rewrite: /
                          timeout: 30s

                      # ── PostgREST REST API ───────────────────────────
                      - match:
                          prefix: /rest/v1/
                        route:
                          cluster: rest
                          prefix_rewrite: /
                          timeout: 30s

                      # ── Realtime WebSocket ───────────────────────────
                      - match:
                          prefix: /realtime/v1/
                        route:
                          cluster: realtime
                          prefix_rewrite: /
                          timeout: 0s     # No timeout for WebSocket
                          upgrade_configs:
                            - upgrade_type: websocket

                      # ── Storage ──────────────────────────────────────
                      - match:
                          prefix: /storage/v1/
                        route:
                          cluster: storage
                          prefix_rewrite: /
                          timeout: 300s   # Large uploads

                      # ── Edge Functions ───────────────────────────────
                      - match:
                          prefix: /functions/v1/
                        route:
                          cluster: functions
                          prefix_rewrite: /
                          timeout: 120s

                      # ── Studio catch-all (root and /pg, /api/platform) ─
                      - match:
                          prefix: /
                        route:
                          cluster: studio
                          timeout: 30s
                        typed_per_filter_config:
                          envoy.filters.http.jwt_authn:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
